name: Release

# Builds the Windows installers on GitHub's own Windows runner and attaches
# them to the release for the pushed tag. Doing it here rather than locally
# keeps a ~220 MB upload off the maintainer's connection, and means the
# download links in the README are filled by the same commit they describe.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# electron-builder needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # electron-builder uploads to the release named by the tag, so a
      # package.json version that disagrees with the tag silently scatters the
      # installers across two releases. Fail here instead.
      - name: Check package version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi

      # The nsis and portable targets publish in parallel, and each one creates
      # the release when it is missing. On a fresh tag both POST /releases at
      # once and the loser dies with 422 already_exists after its assets are
      # already up. Creating the release first leaves both publishers with
      # nothing to do but upload.
      - name: Ensure release exists
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" --generate-notes

      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The installers are unsigned, so Windows greets them with a SmartScreen
      # warning and a user has no way to tell a real download from a tampered
      # one. A checksum published beside them is the one check they can make.
      - name: Publish checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          sha256sum Sound-Visualizer-Setup.exe Sound-Visualizer-Portable.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
