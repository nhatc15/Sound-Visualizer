<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>Sound Visualizer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <span class="title">Sound Visualizer</span>
        <div class="window-buttons">
          <button id="btn-minimize" data-i18n-title="titlebar.minimize" data-i18n-aria="titlebar.minimize">&#8211;</button>
          <button id="btn-close" class="danger" data-i18n-title="titlebar.close" data-i18n-aria="titlebar.close">&#10005;</button>
        </div>
      </header>

      <main id="stage">
        <canvas id="visualizer"></canvas>

        <div id="splash" class="screen">
          <div class="splash-mark">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <h1 class="splash-title">Sound Visualizer</h1>
          <p class="splash-tagline" data-i18n="splash.tagline"></p>
        </div>

        <div id="language" class="screen">
          <div class="home-panel">
            <h1 class="home-title" data-i18n="language.title"></h1>
            <p class="home-subtitle" data-i18n="language.subtitle"></p>
            <div class="home-actions" id="language-actions"></div>
          </div>
        </div>

        <div id="home" class="screen">
          <div class="home-panel">
            <h1 class="home-title">Sound Visualizer</h1>
            <p class="home-subtitle" data-i18n="home.subtitle"></p>
            <div class="home-actions">
              <button id="btn-home-start" class="primary" data-i18n="home.start"></button>
              <button id="btn-home-settings" data-i18n="home.settings"></button>
              <button id="btn-home-quit" class="quiet" data-i18n="home.quit"></button>
            </div>
            <p class="home-hint" data-i18n-html="home.hint"></p>
          </div>
        </div>

        <div id="settings" class="screen">
          <div class="settings-panel">
            <header class="settings-head">
              <h2 data-i18n="settings.title"></h2>
              <button id="btn-settings-back" data-i18n="settings.done" data-i18n-title="settings.back"></button>
            </header>
            <div id="settings-body"></div>
            <footer class="settings-foot">
              <button id="btn-settings-reset" class="quiet" data-i18n="settings.reset"></button>
            </footer>
          </div>
        </div>

        <div id="error" class="overlay-panel hidden">
          <h2 data-i18n="error.title"></h2>
          <p id="error-message"></p>
          <button id="btn-retry" class="primary" data-i18n="error.retry"></button>
        </div>

        <div id="silence-hint" class="floating-hint hidden" data-i18n="silence.hint"></div>
      </main>

      <footer id="controls">
        <button id="btn-home" class="icon" data-i18n-title="controls.homeTitle" data-i18n-aria="controls.home">&#8962;</button>
        <button id="btn-prev" data-i18n-title="controls.prevTitle" data-i18n-aria="controls.prev">&#9664;</button>
        <select id="preset-select" data-i18n-aria="controls.presetSelect"></select>
        <button id="btn-next" data-i18n-title="controls.nextTitle" data-i18n-aria="controls.next">&#9654;</button>

        <select id="layout-select" data-i18n-aria="controls.layoutSelect" data-i18n-title="controls.layoutSelectTitle"></select>
        <select id="cell-select" class="hidden" data-i18n-aria="controls.cellSelect" data-i18n-title="controls.cellSelectTitle"></select>

        <span class="spacer"></span>

        <label class="toggle">
          <input type="checkbox" id="chk-auto" />
          <span data-i18n="controls.auto"></span>
        </label>
        <button id="btn-settings" class="icon" data-i18n-title="controls.settings" data-i18n-aria="controls.settings">&#9881;</button>
        <button id="btn-overlay" data-i18n="controls.overlay" data-i18n-title="controls.overlayTitle"></button>
        <button id="btn-fullscreen" data-i18n="controls.fullscreen" data-i18n-title="controls.fullscreenTitle"></button>
      </footer>

      <div id="overlay-bar">
        <span id="overlay-preset-name"></span>
        <button id="btn-overlay-prev" data-i18n-title="overlay.prev">&#9664;</button>
        <button id="btn-overlay-next" data-i18n-title="overlay.next">&#9654;</button>
        <button id="btn-overlay-fullscreen" data-i18n-title="overlay.fullscreen">&#9974;</button>
        <button id="btn-overlay-exit" class="labelled" data-i18n="overlay.window" data-i18n-title="overlay.windowTitle"></button>
        <button id="btn-overlay-close" class="danger" data-i18n-title="overlay.close">&#10005;</button>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
